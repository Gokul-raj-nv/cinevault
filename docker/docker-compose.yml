
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: cinevault_db
    environment:
      POSTGRES_USER: cinevault
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: cinevault_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinevault -d cinevault_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cinevault_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: